name: Build CueStar

# Comme pour JingleStar, ce workflow ne part qu'à la demande
# (onglet Actions → Build CueStar → Run workflow).
# Chaque paquet embarque libmpv : l'utilisateur n'a rien d'autre à installer.
#   Windows : installeur (Inno Setup) et zip portable, avec libmpv-2.dll (build shinchiro)
#   macOS   : .dmg avec CueStar.app (libmpv Homebrew dans Contents/Frameworks)
#   Linux   : AppImage (libmpv d'Ubuntu 22.04 et ses dépendances)
# Les scripts sont dans apps/cuestar/packaging et se lancent aussi à la main.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Plateformes à construire"
        type: choice
        default: tout
        options:
          - tout
          - windows
          - macos
          - linux
      release:
        description: "Tag de la release GitHub à créer et remplir (ex. cuestar-v0.1.0) ; vide = simple build"
        required: false
        default: ""
      mpv_windows:
        description: "Tag du build shinchiro/mpv-winbuild-cmake pour Windows (ex. 20251102) ; vide = le dernier"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    if: inputs.cible == 'tout' || inputs.cible == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p cuestar -p star-commun
      - name: Build release
        run: cargo build --release -p cuestar
      - name: Récupérer libmpv-2.dll (shinchiro, mpv-dev x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MPV_TAG: ${{ inputs.mpv_windows }}
        run: |
          mkdir -p mpv _mpv
          # Le build « x86_64 » de base (pas « v3 », qui exige un processeur récent).
          gh release download $MPV_TAG --repo shinchiro/mpv-winbuild-cmake \
            --pattern 'mpv-dev-x86_64-[0-9]*.7z' --dir _mpv
          ARCHIVE="$(ls _mpv/*.7z | head -1)"
          7z e -y -o_mpv "$ARCHIVE" libmpv-2.dll -r
          mv _mpv/libmpv-2.dll mpv/
          basename "$ARCHIVE" > mpv/mpv-build.txt
          echo "libmpv : $(cat mpv/mpv-build.txt)"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Installeur et zip portable
        shell: pwsh
        run: apps\cuestar\packaging\windows\package.ps1 -Mpv mpv\libmpv-2.dll -Out dist
      - name: Vérifier que la sortie trouve libmpv
        shell: bash
        run: |
          # Version portable décompressée : libmpv-2.dll doit être chargée depuis le dossier de l'appli.
          test -f dist/stage-windows/libmpv-2.dll
          test -f dist/stage-windows/licences/TIERS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cuestar-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publier dans la release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          name: CueStar ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip

  macos:
    if: inputs.cible == 'tout' || inputs.cible == 'macos'
    # Un runner par architecture : Homebrew ne fournit libmpv que pour celle de la machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel
    runs-on: ${{ matrix.os }}
    env:
      # Signature et notarisation : actives seulement si ces secrets existent (compte Apple Developer).
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: libmpv et dylibbundler (Homebrew)
        run: brew install mpv dylibbundler
      - name: Tests
        run: cargo test -p cuestar -p star-commun
      - name: Build release
        run: cargo build --release -p cuestar --target ${{ matrix.target }}
      - name: Certificat Developer ID
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signature.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Bundle .app et .dmg
        run: apps/cuestar/packaging/macos/bundle.sh ${{ matrix.target }} dist
      - name: Vérifier le paquet
        run: |
          APP=dist/CueStar.app
          test -f "$APP/Contents/Frameworks/libmpv.2.dylib"
          lipo -info "$APP/Contents/MacOS/cuestar"
          # Plus aucune référence à Homebrew dans les bibliothèques embarquées.
          ! otool -L "$APP"/Contents/Frameworks/*.dylib | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'
      - uses: actions/upload-artifact@v4
        with:
          name: cuestar-macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Publier dans la release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          name: CueStar ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg

  linux:
    if: inputs.cible == 'tout' || inputs.cible == 'linux'
    # Ubuntu 22.04 : glibc assez ancienne pour que l'AppImage tourne sur la plupart des distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances Linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev libmpv-dev
      - name: Tests
        run: cargo test -p cuestar -p star-commun
      - name: Build release
        run: cargo build --release -p cuestar
      - name: AppImage
        run: apps/cuestar/packaging/linux/appimage.sh dist
      - name: Vérifier le paquet
        run: |
          ls dist/CueStar.AppDir/usr/lib/ | grep -E '^libmpv\.so'
          test -f dist/CueStar.AppDir/usr/share/doc/cuestar/licences/TIERS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cuestar-linux
          path: dist/*.AppImage
      - name: Publier dans la release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          name: CueStar ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          files: dist/*.AppImage
