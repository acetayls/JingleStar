name: Build JingleStar

# Les builds se font en local sur le PC de Pierrick : ce workflow ne part qu'à la demande
# (onglet Actions → Build JingleStar → Run workflow).
# Dépôt MediaStar : ce workflow ne construit que JingleStar (apps/jinglestar).
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Plateformes à construire"
        type: choice
        default: macos-intel
        options:
          - macos-intel
          - macos
          - tout
      release:
        description: "Tag de la release GitHub à créer et remplir (ex. jinglestar-v0.1.4) ; vide = simple build"
        required: false
        default: ""

jobs:
  build:
    if: inputs.cible == 'tout'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: jinglestar-linux
            bin: target/release/jinglestar
          - os: windows-latest
            artifact: jinglestar-windows
            bin: target/release/jinglestar.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgtk-3-dev
      - name: Tests
        run: cargo test -p jinglestar
      - name: Build release
        run: cargo build --release -p jinglestar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
      - name: Préparer l'exécutable Windows
        if: runner.os == 'Windows' && inputs.release != ''
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version' apps/jinglestar/Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist
          cp target/release/jinglestar.exe "dist/JingleStar-$VERSION-windows-x64.exe"
      - name: Publier dans la release (Windows)
        if: runner.os == 'Windows' && inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          name: JingleStar ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe

  macos:
    # Le runner est Apple Silicon ; la version Intel est compilée en croisé (x86_64-apple-darwin).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cible == 'macos-intel' && '[{"target":"x86_64-apple-darwin","arch":"intel"}]' || '[{"target":"x86_64-apple-darwin","arch":"intel"},{"target":"aarch64-apple-darwin","arch":"apple-silicon"}]') }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p jinglestar
      - name: Build release
        run: cargo build --release -p jinglestar --target ${{ matrix.target }}
      - name: Vérifier l'architecture
        run: lipo -info target/${{ matrix.target }}/release/jinglestar
      - name: Bundle .app et .dmg
        run: apps/jinglestar/packaging/macos/bundle.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: jinglestar-macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Publier dans la release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          name: JingleStar ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
