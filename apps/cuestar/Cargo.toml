[package]
name = "cuestar"
version = "0.0.1"
description = "Diffusion vidéo sur écran de sortie : lecteur, diaporama, cuelist (Windows, macOS, Linux)"
authors = ["Pierrick"]
edition.workspace = true
license.workspace = true

[dependencies]
star-commun.workspace = true
eframe.workspace = true
egui.workspace = true
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
# Moteur de sortie (processus séparé) : fenêtre native, libmpv chargé à l'exécution.
winit = "0.30"
raw-window-handle = "0.6"
softbuffer = "0.4"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff", "webp"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
rosc = "0.11"
midir = "0.11"
crossbeam-channel = "0.5"

[build-dependencies]
# Icône et métadonnées de l'exécutable Windows.
winresource = "0.1"

# Pour un paquet .app macOS avec `cargo bundle --release`.
[package.metadata.bundle]
name = "CueStar"
identifier = "com.acetayls.CueStar"
icon = ["assets/icons/cuestar.icns", "assets/icons/cuestar-1024.png"]
category = "public.app-category.video"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Performance"] }
