[package]
name = "jinglestar"
version = "0.1.4"
description = "Lecteur de jingles et de playlists multi-sorties (Windows, macOS, Linux)"
authors = ["Pierrick"]
edition.workspace = true
license.workspace = true

[dependencies]
star-core.workspace = true
star-ui.workspace = true
star-remote = { workspace = true, features = ["ui"] }
eframe.workspace = true
egui.workspace = true
rfd = "0.17"
cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
keepawake = "0.6"
rosc = "0.11"
midir = "0.11"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Position du curseur pendant un glisser-déposer (winit ne la transmet pas sous Windows).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Icône et métadonnées de l'exécutable Windows, version de build.
star-build.workspace = true

# Pour un paquet .app macOS avec `cargo bundle --release`.
[package.metadata.bundle]
name = "JingleStar"
identifier = "com.acetayls.JingleStar"
icon = ["assets/icons/jinglestar.icns", "assets/icons/jinglestar-1024.png"]
category = "public.app-category.music"

[features]
# Support ASIO sous Windows (nécessite le SDK ASIO de Steinberg, voir README).
asio = ["cpal/asio"]
