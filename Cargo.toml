# Dépôt MediaStar : JingleStar, CueStar et la crate commune star-commun.
# Chaque application garde sa propre version et ses propres releases (tags jinglestar-vX.Y.Z, cuestar-vX.Y.Z).
[workspace]
resolver = "2"
members = [
    "crates/star-commun",
    "crates/star-build",
    "apps/jinglestar",
    "apps/cuestar",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Pierrick"]

[workspace.dependencies]
# Une seule version d'egui pour toutes les applications.
eframe = "0.37"
egui = "0.37"
star-commun = { path = "crates/star-commun" }
star-build = { path = "crates/star-build" }

# Build de développement plus rapide à l'exécution : dépendances optimisées pour toutes les
# applications, et CueStar lui-même en opt-level 1 (lecture vidéo, vignettes, régie).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.cuestar]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
