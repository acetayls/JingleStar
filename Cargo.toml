[package]
name = "jinglestar"
version = "0.1.0"
description = "Lecteur de jingles et de playlists multi-sorties (Windows, macOS, Linux)"
authors = ["Pierrick"]
edition = "2021"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
rfd = "0.17"
cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
keepawake = "0.6"
rosc = "0.11"
tiny_http = "0.12"
mdns-sd = "0.21"

[build-dependencies]
# Icône et métadonnées de l'exécutable Windows.
winresource = "0.1"

# Pour un paquet .app macOS avec `cargo bundle --release`.
[package.metadata.bundle]
name = "JingleStar"
identifier = "com.acetayls.JingleStar"
icon = ["assets/icons/jinglestar.icns", "assets/icons/jinglestar-1024.png"]
category = "public.app-category.music"

[features]
# Support ASIO sous Windows (nécessite le SDK ASIO de Steinberg, voir README).
asio = ["cpal/asio"]

[profile.release]
lto = true
codegen-units = 1
