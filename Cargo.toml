# Dépôt MediaStar : JingleStar, CueStar et la crate commune star-commun.
# Chaque application garde sa propre version et ses propres releases (tags jinglestar-vX.Y.Z, cuestar-vX.Y.Z).
[workspace]
resolver = "2"
members = [
    "crates/star-commun",
    "apps/jinglestar",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Pierrick"]

[workspace.dependencies]
# Une seule version d'egui pour toutes les applications.
eframe = "0.37"
egui = "0.37"
star-commun = { path = "crates/star-commun" }

[profile.release]
lto = true
codegen-units = 1
